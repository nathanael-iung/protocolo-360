<div class="flex flex-col gap-5">
  <div class="w-full h-[55vh] overflow-y-auto flex flex-col gap-10 py-5">
    <p class="text-2xl font-semibold text-center">Olá, Fulano</p>
    <p class="font-light">Seja bem-vindo(a) ao Protocolo 360. Você está prestes a finalizar o seu cadastro e iniciar sua nova jornada em busca de seus objetivos.</p>
    <div class="flex justify-center">
      <ng-icon name="lucidePartyPopper" class="text-8xl text-primary" />
    </div>
  </div>
  <div class="flex justify-end gap-2 w-full">
    <button
      hlmBtn
      type="button"
      size="lg"
      class="bg-primary cursor-pointer rounded-md p-2"
      appKeyEvent="Enter"
      (event)="nextStep()"
      (click)="nextStep()"
    >
      Finalizar
    </button>
  </div>
</div>

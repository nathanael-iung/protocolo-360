<hlm-toggle-group
  class="flex flex-wrap justify-center max-h-[55vh] gap-5 overflow-y-auto w-full"
  type="multiple"
  (valueChange)="goalChanged($event)"
>
  @for (goal of goals(); track $index) {
    <button hlmToggleGroupItem [value]="goal.shortName">{{ goal.fullName }}</button>
  }
</hlm-toggle-group>
